name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z format."
            exit 1
          fi

          version="${tag#v}"
          source_version="$(perl -ne 'print $1 if /Version = "([^"]+)"/' Plugin.cs)"
          project_version="$(perl -ne 'print $1 if /<PartyAIVersion>([^<]+)<\/PartyAIVersion>/' GloomhavenPartyAI.csproj)"
          if [[ "${source_version}" != "${version}" || "${project_version}" != "${version}" ]]; then
            echo "Tag ${tag}, Plugin.cs ${source_version}, and project ${project_version} must match."
            exit 1
          fi
          strings -el artifacts/GloomhavenPartyAI.dll > /tmp/gloomhaven-party-ai-strings.txt
          if ! grep -Fxq "${version}" /tmp/gloomhaven-party-ai-strings.txt; then
            echo "The tracked release DLL does not report version ${version}."
            exit 1
          fi

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release/package/GloomhavenPartyAI
          cp artifacts/GloomhavenPartyAI.dll release/GloomhavenPartyAI.dll
          cp artifacts/GloomhavenPartyAI.dll release/package/GloomhavenPartyAI/GloomhavenPartyAI.dll
          (
            cd release/package
            zip -r "../GloomhavenPartyAI-${tag}.zip" GloomhavenPartyAI
          )
          (
            cd release
            sha256sum GloomhavenPartyAI.dll "GloomhavenPartyAI-${tag}.zip" > SHA256SUMS.txt
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/GloomhavenPartyAI.dll \
            "release/GloomhavenPartyAI-${GITHUB_REF_NAME}.zip" \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Gloomhaven Party AI ${GITHUB_REF_NAME}"
